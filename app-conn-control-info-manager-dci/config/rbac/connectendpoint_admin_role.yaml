# This rule is not used by the project app-conn-control-info-manager-dci itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: app-conn-control-info-manager-dci
    app.kubernetes.io/managed-by: kustomize
  name: connectendpoint-admin-role
rules:
- apiGroups:
  - example.com
  resources:
  - connectendpoints
  verbs:
  - '*'
- apiGroups:
  - example.com
  resources:
  - connectendpoints/status
  verbs:
  - get
