# This rule is not used by the project app-conn-control-info-manager-dci itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: app-conn-control-info-manager-dci
    app.kubernetes.io/managed-by: kustomize
  name: dciappstate-viewer-role
rules:
- apiGroups:
  - example.com
  resources:
  - dciappstates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - example.com
  resources:
  - dciappstates/status
  verbs:
  - get
