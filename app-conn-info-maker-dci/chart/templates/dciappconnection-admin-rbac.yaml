apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-dciappconnection-admin-role
  labels:
  {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - example.com
  resources:
  - dciappconnections
  verbs:
  - '*'
- apiGroups:
  - example.com
  resources:
  - dciappconnections/status
  verbs:
  - get
