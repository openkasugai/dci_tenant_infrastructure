# This rule is not used by the project app-conn-info-maker-dci itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: app-conn-info-maker-dci
    app.kubernetes.io/managed-by: kustomize
  name: dciappconnection-viewer-role
rules:
- apiGroups:
  - example.com
  resources:
  - dciappconnections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - example.com
  resources:
  - dciappconnections/status
  verbs:
  - get
