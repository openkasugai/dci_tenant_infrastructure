  verbs:
  - get
  - patch
  - update
- apiGroups:
  - mellanox.com
  resources:
  - hostdevicenetworks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mellanox.com
  resources:
  - hostdevicenetworks/status
  verbs:
  - get
