apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-client
  namespace: temporal
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: temporal-client
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: client
          image: 'localhost/temporal-client:1.0.0'
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_ADDRESS
              value: temporal-stack-frontend.temporal.svc.cluster.local:7233
            - name: SHARD_COUNT
              valueFrom:
                configMapKeyRef:
                  name: shard-config
                  key: SHARD_COUNT
                  optional: true
            - name: MAX_START_ATTEMPTS
              value: "5"
            - name: START_TIMEOUT
              value: "120s"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
