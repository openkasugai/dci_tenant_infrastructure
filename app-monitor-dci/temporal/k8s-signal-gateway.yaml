---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-gateway
  namespace: temporal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: temporal-gateway
  template:
    metadata:
      labels:
        app: temporal-gateway
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["temporal-gateway"]
              topologyKey: "kubernetes.io/hostname"
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
      - name: worker
        image: 'localhost/temporal-gateway:1.0.0'
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: TEMPORAL_NAMESPACE
          value: default
        - name: TEMPORAL_ADDRESS
          value: temporal-stack-frontend.temporal.svc.cluster.local:7233
        - name: SHARD_COUNT
          valueFrom:
            configMapKeyRef:
              name: shard-config
              key: SHARD_COUNT
              optional: true
        - name: MAX_SIGNAL_BUF_SIZE
          value: "600"
        - name: WORKFLOW_HEALTH_CHECK_INTERVAL_SEC
          value: "300"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-gateway
  namespace: temporal
spec:
  selector:
    app: temporal-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
