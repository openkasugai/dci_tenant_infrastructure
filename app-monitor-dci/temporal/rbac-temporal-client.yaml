apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-client
  namespace: temporal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-client-role
  namespace: temporal
rules:
# Read the owning Pod to resolve the parent Job for Event attribution.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
# Emit Kubernetes Events describing workflow start success/failure.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-client-rolebinding
  namespace: temporal
subjects:
- kind: ServiceAccount
  name: temporal-client
  namespace: temporal
roleRef:
  kind: Role
  name: temporal-client-role
  apiGroup: rbac.authorization.k8s.io
