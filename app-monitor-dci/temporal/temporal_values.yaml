elasticsearch:
  enabled: true
  replicas: 2
  persistence:
    enabled: true
  volumeClaimTemplate:  
    storageClassName: "nfs-client"
    accessModes: ["ReadWriteOnce"]
  imageTag: 7.17.3
  host: elasticsearch-master-headless
  scheme: http
  port: 9200
  version: "v7"
  logLevel: "error"
  username: ""
  password: "*******"
  visibilityIndex: "temporal_visibility_v1_dev"
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  antiAffinity: "hard"
  antiAffinityTopologyKey: "kubernetes.io/hostname"
  maxUnavailable: 1
prometheus:
  enabled: false
grafana:
  enabled: false
cassandra:
  enabled: true
  persistence:
    enabled: true
    storageClass: "nfs-client"
    accessMode: ReadWriteOnce
  image:
    repo: docker.io/cassandra
    tag: 3.11.3
    pullPolicy: IfNotPresent
  config:
    cluster_size: 3
    ports:
      cql: 9042
    num_tokens: 4
    max_heap_size: 512M
    heap_new_size: 128M
    seed_size: 2
    endpoint_snitch: GossipingPropertyFileSnitch
    dc_name: "DC1"
    rack_name: "RAC1"
  service:
    type: ClusterIP
  selector:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: cassandra
        topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    minAvailable: 1
mysql:
  enabled: false
