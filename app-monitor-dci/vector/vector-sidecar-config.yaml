    reroute_dropped = true
    source = '''
    .data_source = "tick"
    .pod_uid = get_env_var!("POD_UID")
    del(.command)
    del(.host)
    del(.pid)
    del(.source_type)
    del(.stream)
    del(.timestamp)
    del(.timestamp_end)
    '''

    ### Transform
    [transforms.transform_status_to_cr]
    type = "remap"
    inputs = ["tag_status_data"]
    drop_on_error = true
    reroute_dropped = true
    source = '''
    status_info = .

    del(status_info.data_type)
    del(status_info.source_type)
    del(status_info.timestamp)

    . = {
      "pod_uid": get_env_var!("POD_UID"),
      "status_info": status_info
    }
    '''

    ### Reduce
    [transforms.create_unified_event]
    type = "reduce"
    inputs = ["transform_status_to_cr","tag_tick_data"]
    group_by = ["pod_uid"]
    merge_strategies.status_info = "retain"
    flush_period_ms = 6000
    max_events = 2

    ### Final CR structure
    ### - status: If the status endpoint responds, outputs the return value, if it does'nt respond, outputs "error:xxx"
    ### - metrics: always empty value({})
    ### - metas  : always empty value({})
    [transforms.final_cr_structure]
    type = "remap"
    inputs = ["create_unified_event"]
    drop_on_error = true
    reroute_dropped = true
    source = '''
    .metadata = {
      "uid": get_env_var!("POD_UID"),
      "name": get_env_var!("POD_NAME"),
      "namespace": get_env_var!("POD_NAMESPACE")
    }
    .spec = { "type": get_env_var!("POD_APP_LABEL") }

    warn_map = { "error": "This value could not be retrieved." }

    status_data = if exists(.status_info) { .status_info } else { warn_map }

    .status = {
      "appStatus": {
        "status": status_data,
        "metrics": {},
        "metas": {}
      }
    }

    del(.pod_uid)
    del(.status_info)
    '''

    ### Sink
    [sinks.argoevents_trigger_event]
    type = "http"
    inputs = ["final_cr_structure"]
    uri = "http://vector-webhook-eventsource-svc.argo-events.svc.cluster.local:12001/vector-temporal-trigger"
    method = "post"
    encoding.codec = "json"
    framing.method = "newline_delimited"

    [sinks.argoevents_trigger_event.healthcheck]
    enabled = true

    [sinks.argoevents_trigger_event.request]
    timeout_secs = 4
    retry_attempts = 1
    headers = { "Content-Type" = "application/json" }

    [sinks.final_cr_structure_dropped_log]
    type = "console"
    inputs = ["final_cr_structure.dropped"]
    encoding.codec = "json"

    [sinks.remap_dropped_log]
    type = "console"
    inputs = [
      "transform_status_to_cr.dropped",
      "final_cr_structure.dropped"
    ]
    encoding.codec = "json"

    ### Vector internal API / Health
    [api]
    enabled = true
    address = "0.0.0.0:9590"


