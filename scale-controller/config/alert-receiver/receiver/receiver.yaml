
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: system
  labels:
    control-plane: alert-receiver
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: alert-receiver
      app.kubernetes.io/name: alert-receiver
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alert-receiver
      labels:
        control-plane: alert-receiver
        app.kubernetes.io/name: alert-receiver
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /alert-receiver
        args: []
        image: alert-receiver:latest
        name: alert-receiver
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz # Use same path as livenessProbe to check the readiness of the application.
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
        env: []
      volumes: []
      serviceAccountName: alert-receiver-sa
      terminationGracePeriodSeconds: 10
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
