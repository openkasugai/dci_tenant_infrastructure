apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: scale-controller
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: scale-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: scale-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: scale-controller
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/management-kubeconfig
          name: management-kubeconfig
          readOnly: true
        env:
        - name: MANAGEMENT_KUBECONFIG
          value: /etc/management-kubeconfig/kubeconfig
        # This field determines TTL seconds for nsr deletion after finished its request
        # unless ownerReferences are set into nsr from other resources,
        # and if you comment this field, auto deletion for nsr will not be executed.
        - name: NSR_TTL_SECONDS_AFTER_FINISHED
          value: "3600"
        # This field determines TTL seconds for csr deletion after finished its request
        # unless ownerReferences are set into csr from other resources,
        # and if you comment this field, auto deletion for csr will not be executed.
        - name: CSR_TTL_SECONDS_AFTER_FINISHED
          value: "3600"
        # This field determines TTL seconds for card alert deletion after finished its request
        # unless ownerReferences are set into card alert from other resources,
        # and if you comment this field, auto deletion for card alert will not be executed.
        - name: CARD_ALERT_TTL_SECONDS_AFTER_FINISHED
          value: "3600"
        # This field determines namespace for MachineAlert resource which is created by CardAlert reconciler,
        # and the controller requires this field, so if you comment this field, the controller will be failed to start.
        - name: MACHINE_ALERT_NAMESPACE
          value: dcirpm
        # This field determines supporting provider: DCI, Docker
        - name: PROVIDER_NAME
          value: DCI
      volumes:
      - name: management-kubeconfig
        secret:
          secretName: management-kubeconfig
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
