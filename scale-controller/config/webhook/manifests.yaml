---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cluster-my-domain-v1alpha1-cardscalingrequest
  failurePolicy: Fail
  name: vcardscalingrequest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - cluster.my.domain
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cardscalingrequests
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cluster-my-domain-v1alpha1-nodescalingrequest
  failurePolicy: Fail
  name: vnodescalingrequest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - cluster.my.domain
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodescalingrequests
  sideEffects: None
