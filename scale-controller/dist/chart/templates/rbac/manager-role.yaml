apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "scale-controller.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.my.domain
  resources:
  - cardalerts
  - cardscalingrequests
  - nodescalingrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cluster.my.domain
  resources:
  - cardalerts/finalizers
  - cardscalingrequests/finalizers
  - nodescalingrequests/finalizers
  verbs:
  - update
- apiGroups:
  - cluster.my.domain
  resources:
  - cardalerts/status
  - cardscalingrequests/status
  - nodescalingrequests/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - resource.k8s.io
  resources:
  - devicetaintrules
  verbs:
  - create
  - get
  - list
  - watch
