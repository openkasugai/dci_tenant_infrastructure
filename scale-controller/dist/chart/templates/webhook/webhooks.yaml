{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: scale-controller-validating-webhook-configuration
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: "{{ $.Release.Namespace }}/serving-cert"
    {{- end }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
webhooks:
  - name: vcardscalingrequest-v1alpha1.kb.io
    clientConfig:
      service:
        name: scale-controller-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-cluster-my-domain-v1alpha1-cardscalingrequest
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions:
      - v1
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - cluster.my.domain
        apiVersions:
          - v1alpha1
        resources:
          - cardscalingrequests
  - name: vnodescalingrequest-v1alpha1.kb.io
    clientConfig:
      service:
        name: scale-controller-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-cluster-my-domain-v1alpha1-nodescalingrequest
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions:
      - v1
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - cluster.my.domain
        apiVersions:
          - v1alpha1
        resources:
          - nodescalingrequests
{{- end }}
