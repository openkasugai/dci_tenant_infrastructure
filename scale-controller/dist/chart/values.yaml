## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

# [MANAGER]: Manager Deployment Configurations
## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: scale-controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    tag: 1.0.0
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: MANAGEMENT_KUBECONFIG
      value: /etc/management-kubeconfig/kubeconfig

    # This field determines TTL seconds for nsr deletion after finished its request
    # unless ownerReferences are set into nsr from other resources,
    # and if you remove this field, auto deletion for nsr will not be executed.
    - name: NSR_TTL_SECONDS_AFTER_FINISHED
      value: "3600"

    # This field determines TTL seconds for csr deletion after finished its request
    # unless ownerReferences are set into csr from other resources,
    # and if you remove this field, auto deletion for csr will not be executed.
    - name: CSR_TTL_SECONDS_AFTER_FINISHED
      value: "3600"

    # This field determines TTL seconds for card alert deletion after finished its request
    # unless ownerReferences are set into card alert from other resources,
    # and if you remove this field, auto deletion for card alert will not be executed.
    - name: CARD_ALERT_TTL_SECONDS_AFTER_FINISHED
      value: "3600"

    # This field determines namespace for MachineAlert resource which is created by CardAlert reconciler.
    # The controller requires this field when auto replacement is enabled.
    - name: MACHINE_ALERT_NAMESPACE
      value: dcirpm

    # PROVIDER_NAME is optional. If omitted, controller defaults to DCI.
    # Uncomment only when you need to switch provider explicitly (e.g. Docker).
    # - name: PROVIDER_NAME
    #   value: DCI

    # Optional settings for CardAlert behavior:
    # - name: ENV_CARD_ALERT_AUTO_REPLACE_ENABLED
    #   value: "false"
    # - name: ENV_CARD_ALERT_CARD_TAINT_POLICY
    #   value: "NoSchedule"

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  ## Manager pod's tolerations
  ##
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

  ## Extra volumes and volume mounts
  ##
  extraVolumes:
    - name: management-kubeconfig
      secret:
        secretName: management-kubeconfig

  extraVolumeMounts:
    - mountPath: /etc/management-kubeconfig
      name: management-kubeconfig
      readOnly: true

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: true

## Webhook server configuration
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

# Raw kubeconfig content for management cluster access.
# Default value is for local rendering/tests only. Do not use in production.
# In production, always override with --set-file managementKubeconfig=/path/to/management.kubeconfig
managementKubeconfig: "dummy-kubeconfig"

# [ALERT RECEIVER]: Alert Receiver Deployment Configurations
alertReceiver:
  enabled: true
  replicas: 1
  container:
    image:
      repository: card-alert-receiver
      tag: 1.0.0
    env:
      CARD_ALERT_NAMESPACE: default
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        # Use the same path for readiness and liveness probes to simplify alert-receiver behavior.
        path: /healthz
        port: 8080
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: scale-controller-alert-receiver-sa
  terminationGracePeriodSeconds: 10
