apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: alert-receiver
  name: scale-controller-alert-receiver-sa
  namespace: scale-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: alert-receiver
  name: scale-controller-alert-receiver-role
rules:
  - apiGroups:
      - cluster.my.domain
    resources:
      - cardalerts
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - cluster.my.domain
    resources:
      - cardalerts/status
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: alert-receiver
  name: scale-controller-alert-receiver-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scale-controller-alert-receiver-role
subjects:
  - kind: ServiceAccount
    name: scale-controller-alert-receiver-sa
    namespace: scale-controller-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: alert-receiver
  name: scale-controller-alert-receiver-service
  namespace: scale-controller-system
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    control-plane: alert-receiver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: alert-receiver
    control-plane: alert-receiver
  name: scale-controller-alert-receiver
  namespace: scale-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
      control-plane: alert-receiver
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alert-receiver
      labels:
        app.kubernetes.io/name: alert-receiver
        control-plane: alert-receiver
    spec:
      containers:
        - args: []
          command:
            - /alert-receiver
          env:
            - name: CARD_ALERT_NAMESPACE
              value: default
          image: card-alert-receiver:latest
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          name: alert-receiver
          ports: []
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts: []
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: scale-controller-alert-receiver-sa
      terminationGracePeriodSeconds: 10
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes: []
