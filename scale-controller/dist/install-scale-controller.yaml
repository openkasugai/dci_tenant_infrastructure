apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: scale-controller
  name: scale-controller-webhook-service
  namespace: scale-controller-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: scale-controller
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: scale-controller
    control-plane: controller-manager
  name: scale-controller-controller-manager
  namespace: scale-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scale-controller
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: scale-controller
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          command:
            - /manager
          env:
            - name: MANAGEMENT_KUBECONFIG
              value: /etc/management-kubeconfig/kubeconfig
            - name: NSR_TTL_SECONDS_AFTER_FINISHED
              value: "3600"
            - name: CSR_TTL_SECONDS_AFTER_FINISHED
              value: "3600"
            - name: CARD_ALERT_TTL_SECONDS_AFTER_FINISHED
              value: "3600"
            - name: MACHINE_ALERT_NAMESPACE
              value: dcirpm
            - name: PROVIDER_NAME
              value: DCI
          image: controller:latest
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/management-kubeconfig
              name: management-kubeconfig
              readOnly: true
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: scale-controller-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - name: management-kubeconfig
          secret:
            secretName: management-kubeconfig
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: scale-controller
  name: scale-controller-metrics-certs
  namespace: scale-controller-system
spec:
  dnsNames:
    - scale-controller-controller-manager-metrics-service.scale-controller-system.svc
    - scale-controller-controller-manager-metrics-service.scale-controller-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: scale-controller-selfsigned-issuer
  secretName: metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: scale-controller
  name: scale-controller-serving-cert
  namespace: scale-controller-system
spec:
  dnsNames:
    - scale-controller-webhook-service.scale-controller-system.svc
    - scale-controller-webhook-service.scale-controller-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: scale-controller-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: scale-controller
  name: scale-controller-selfsigned-issuer
  namespace: scale-controller-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: scale-controller-system/scale-controller-serving-cert
  name: scale-controller-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: scale-controller-webhook-service
        namespace: scale-controller-system
        path: /validate-cluster-my-domain-v1alpha1-cardscalingrequest
    failurePolicy: Fail
    name: vcardscalingrequest-v1alpha1.kb.io
    rules:
      - apiGroups:
          - cluster.my.domain
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - cardscalingrequests
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: scale-controller-webhook-service
        namespace: scale-controller-system
        path: /validate-cluster-my-domain-v1alpha1-nodescalingrequest
    failurePolicy: Fail
    name: vnodescalingrequest-v1alpha1.kb.io
    rules:
      - apiGroups:
          - cluster.my.domain
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - nodescalingrequests
    sideEffects: None
