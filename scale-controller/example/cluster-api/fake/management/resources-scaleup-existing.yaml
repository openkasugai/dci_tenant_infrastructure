# Dummy resources for workload cluster in Management Cluster are defined here.
# These are created for simulating scaling operations with scaling up existing MachineDeployment.
# DCIMachine, Machine
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  labels:
    cluster.x-k8s.io/deployment-name: ${MD_NAME}
  name: fake-worker-machine-01
  namespace: default
spec:
  bootstrap:
    {}
  clusterName: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DCIMachine
    name: fake-worker-dci-machine-01
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DCIMachine
metadata:
  name: fake-worker-dci-machine-01
  namespace: default
spec:
  location: dc1
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
    gpu:
      model: H100
      num: 1
    nic:
      model: Connect-X6
      num: 1
---
apiVersion: example.com/v1
kind: LogicalServer
metadata:
  name: fake-logical-server-01
  namespace: dcirpm
spec:
  role: worker
  location: dc1
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
    gpu:
      model: H100
      num: 1
    nic:
      model: Connect-X6
      num: 1
