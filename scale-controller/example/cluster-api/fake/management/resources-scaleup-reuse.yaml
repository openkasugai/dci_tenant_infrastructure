# Dummy resources for workload cluster in Management Cluster are defined here.
# These are created for simulating scaling operations with creating new MachineDeployment in controller.
# MachineSet, DCIMachine, Machine
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineSet
metadata:
  name: fake-worker-ms-03
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    spec:
      version: v1.34.2
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DCIMachineTemplate
        name: ${INFRA_TEMPLATE_NAME}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  labels:
    cluster.x-k8s.io/deployment-name: ${MD_NAME}
  name: fake-worker-machine-03
  namespace: default
spec:
  bootstrap:
    {}
  clusterName: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DCIMachine
    name: fake-worker-dci-machine-03
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DCIMachine
metadata:
  name: fake-worker-dci-machine-03
  namespace: default
spec:
  location: dc2
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
---
apiVersion: example.com/v1
kind: LogicalServer
metadata:
  name: fake-logical-server-03
  namespace: dcirpm
spec:
  role: worker
  location: dc1
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
    
