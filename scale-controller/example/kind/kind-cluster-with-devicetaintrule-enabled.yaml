kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: dual
nodes:
- role: control-plane
  image: kindest/node:v1.34.2
  kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta3
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        runtime-config: "resource.k8s.io/v1alpha3=true"
        feature-gates: "DRADeviceTaints=true"
    controllerManager:
      extraArgs:
        feature-gates: "DRADeviceTaints=true"
    scheduler:
      extraArgs:
        feature-gates: "DRADeviceTaints=true"
