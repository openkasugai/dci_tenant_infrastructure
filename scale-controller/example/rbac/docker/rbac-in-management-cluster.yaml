# This file contains the RBAC resources to be applied in the management cluster for the scale controller to work.
# You can modify below parameters to fit your specific needs.
---
# PER CLUSTER RBAC RESOURCES:
# This ClusterRole is for granting permissions to the scale controller to manage CAPI and infra resources.
# The following Role is defined as a ClusterRole because it is shared across tenants without differences between them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scale-controller-capi-role
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machinedeployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machinesets"]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "update", "patch", "delete"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["dockermachinetemplates"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
# This RoleBinding is for granting permissions to the scale controller to manage CAPI and infra resources.
# The following RoleBinding is defined as a RoleBinding because it is tenant-specific and needs to be created in each tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default # Change to the tenant namespace as needed
  name: scale-controller-capi-rb
subjects:
  - kind: ServiceAccount
    namespace: default # See below service account definition
    name: scale-controller-tenant-sa # See below service account definition
roleRef:
  kind: ClusterRole
  name: scale-controller-capi-role
  apiGroup: rbac.authorization.k8s.io
---
# PER TENANT RBAC RESOURCES:
# This ServiceAccount is for the scale controller to access the management cluster.
# The namespace for ServiceAccount for any tenant can be any namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: default
  name: scale-controller-tenant-sa
---
# PER TENANT RBAC RESOURCES:
# This Secret is for the scale controller to access the management cluster using the above ServiceAccount.
# The namespace for Secret for any tenant can be any namespace,
# but it should match the namespace of the ServiceAccount.
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: scale-controller-tenant-secret
  annotations:
    kubernetes.io/service-account.name: "scale-controller-tenant-sa"
type: kubernetes.io/service-account-token
