{{- if .Values.alertReceiver.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: alert-receiver-role
rules:
- apiGroups:
  - cluster.my.domain
  resources:
  - cardalerts
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - cluster.my.domain
  resources:
  - cardalerts/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
{{- end -}}
