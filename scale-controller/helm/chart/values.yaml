# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: scale-controller
      tag: 0.3.4
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
    env:
      # This field determines TTL seconds for nsr deletion after finished its request
      # unless ownerReferences are set into nsr from other resources,
      # and if you comment this field, auto deletion for nsr will not be executed.
      NSR_TTL_SECONDS_AFTER_FINISHED: 3600

      # This field determines TTL seconds for csr deletion after finished its request
      # unless ownerReferences are set into csr from other resources,
      # and if you comment this field, auto deletion for csr will not be executed.
      CSR_TTL_SECONDS_AFTER_FINISHED: 3600

      # This field determines TTL seconds for card alert deletion after finished its request
      # unless ownerReferences are set into card alert from other resources,
      # and if you comment this field, auto deletion for card alert will not be executed.
      CARD_ALERT_TTL_SECONDS_AFTER_FINISHED: 3600

      # This field determines whether auto replacement for card alert is enabled or not,
      # and if you uncomment this field, auto replacement for card alert will be enabled.
      # ENV_CARD_ALERT_AUTO_REPLACE_ENABLED: "false"

      # This field determines taint policy for card alert,
      # and if you uncomment this field, the taint policy for card alert will be set as "NoExecute".
      # ENV_CARD_ALERT_CARD_TAINT_POLICY: "NoSchedule"

      # This field determines namespace for MachineAlert resource which is created by CardAlert reconciler,
      # and the controller requires this field when auto replacement is enabled,
      # so if you comment this field, the controller will be failed to start.
      MACHINE_ALERT_NAMESPACE: dcirpm

      # # This field determines supporting provider: DCI, Docker
      # PROVIDER_NAME: DCI
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: scale-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: true

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [ALERT RECEIVER]: Alert Receiver Deployment Configurations
alertReceiver:
  enable: true
  replicas: 1
  container:
    image:
      repository: card-alert-receiver
      tag: 0.3.4
    env:
      CARD_ALERT_NAMESPACE: default
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /healthz # Use the same path for readiness and liveness probes to simplify the implementation of the alert receiver
        port: 8080
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: scale-controller-alert-receiver-sa
  terminationGracePeriodSeconds: 10
