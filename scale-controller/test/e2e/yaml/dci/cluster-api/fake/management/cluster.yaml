# Dummy resources for workload cluster in Management Cluster are defined here.
# MachineDeployment, MachineSet, Machine, DCIMachine, DCIMachineTemplate
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: fake-worker-md-00
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DCIMachineTemplate
        name: worker-dmt-dc1-cots-g1n1
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineSet
metadata:
  name: fake-worker-ms-00
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
    spec:
      version: v1.34.2
      clusterName: ${CLUSTER_NAME}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DCIMachineTemplate
        name: worker-dmt-dc1-cots-g1n1
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  labels:
    cluster.x-k8s.io/deployment-name: fake-worker-md-00
  name: fake-worker-machine-00
  namespace: default
spec:
  bootstrap:
    {}
  clusterName: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DCIMachine
    name: fake-worker-dci-machine-00
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DCIMachine
metadata:
  name: fake-worker-dci-machine-00
  namespace: default
spec:
  location: dc1
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
    gpu:
      model: H100
      num: 1
    nic:
      model: Connect-X6
      num: 1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DCIMachineTemplate
metadata:
  name: worker-dmt-dc1-cots-g1n1
  namespace: default
spec:
  template:
    spec:
      location: dc1
      serverSpec:
        type:	ComposedServer
        os:
          distribution: rhel
          version: "9.5"
        gpu:
          model: H100
          num: 1
        nic:
          model: Connect-X6
          num: 1
---
apiVersion: v1
kind: Namespace
metadata:
  name: dcirpm
---
apiVersion: example.com/v1
kind: LogicalServer
metadata:
  name: fake-logical-server-00
  namespace: dcirpm
spec:
  role: worker
  location: dc1
  serverSpec:
    type:	ComposedServer
    os:
      distribution: rhel
      version: "9.5"
    gpu:
      model: H100
      num: 1
    nic:
      model: Connect-X6
      num: 1
