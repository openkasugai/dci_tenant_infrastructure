apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: fake-worker-md-not-used
  namespace: default
spec:
  clusterName: dummy-cluster-not-used
  replicas: 0
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: dummy-cluster-not-used
  template:
    spec:
      clusterName: dummy-cluster-not-used
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DCIMachineTemplate
        name: worker-dmt-not-used
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineSet
metadata:
  name: fake-worker-ms-not-used
  namespace: default
spec:
  clusterName: dummy-cluster-not-used
  replicas: 0
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: dummy-cluster-not-used
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: dummy-cluster-not-used
    spec:
      version: v1.34.2
      clusterName: dummy-cluster-not-used
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DCIMachineTemplate
        name: worker-dmt-not-used
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DCIMachineTemplate
metadata:
  name: worker-dmt-not-used
  namespace: default
spec:
  template:
    spec:
      location: dc2
      serverSpec:
        type:	ComposedServer
        os:
          distribution: rhel
          version: "9.5"
