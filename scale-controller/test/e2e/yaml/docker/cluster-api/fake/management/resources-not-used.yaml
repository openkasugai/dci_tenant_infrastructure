apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: worker-md-not-used
  namespace: default
spec:
  clusterName: dummy-cluster-not-used
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: dummy-cluster-not-used
  template:
    spec:
      clusterName: dummy-cluster-not-used
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: worker
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DockerMachineTemplate
        name: worker-dmt-not-used
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: worker-dmt-not-used
  namespace: default
spec:
  template:
    spec:
      preLoadImages:
      - "docker.io/calico/kube-controllers:v3.31.2"
      - "docker.io/calico/cni:v3.31.2"
      - "docker.io/calico/node:v3.31.2"
      extraMounts:
      - containerPath: /var/run/docker.sock
        hostPath: /var/run/docker.sock
